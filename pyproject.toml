[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-cli"
version = "0.1"
description = "Anton - Production-grade autonomous CLI coding assistant and multi-agent evaluator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anton Team" }]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "google-api-python-client>=2.120.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "tavily-python>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
anton = "ai_cli.main:main"
ai-cli = "ai_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
